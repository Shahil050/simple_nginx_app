apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:latest
          ports:
            - containerPort: 8080  # because port 80 required administrative request.
              protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP


---

apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nginx

spec:
  to:
    kind: Service
    name: nginx
  port:
    targetPort: 80 # tells the outer route to match our Service entry port 80